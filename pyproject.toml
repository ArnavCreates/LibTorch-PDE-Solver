[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "libtorch-pde-solver-verification"
version = "1.0.0"
description = "Evaluation tools for a C++ PINN and finite-difference heat solver"
authors = [{ name = "Arnav Jain", email = "arnav.learns0908@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
