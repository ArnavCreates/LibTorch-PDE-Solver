name: LibTorch PDE Solver CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  cpp-and-python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libhdf5-dev libgtest-dev libomp-dev curl unzip

      - name: Download LibTorch C++11 ABI CPU distribution
        run: |
          mkdir -p .deps
          curl --fail --location --retry 3 "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.5.1%2Bcpu.zip" -o .deps/libtorch.zip
          unzip -q .deps/libtorch.zip -d .deps
          rm -f .deps/libtorch.zip

      - name: Configure, build, and run C++ tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/.deps/libtorch"
          cmake --build build --target pde_unit_tests pde_solver_main
          ctest --test-dir build --output-on-failure

      - name: Install Python dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest -v
